# TEMPORARY — isolate the silent exit(1) in the numba test job. Delete when found.
name: debug-numba-crash
on:
  push:
    branches: [feature/ci]
    paths: ['.github/workflows/debug-numba-crash.yml']
jobs:
  probe:
    name: probe (${{ matrix.case }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case: [full-nocapture, skip-numba-tests, skip-multi-polygon, numpy-only-nocapture]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt pytest==9.1.1
      - name: probe
        shell: pwsh
        run: |
          $t = 'tests'
          $extra = @()
          switch ('${{ matrix.case }}') {
            'skip-numba-tests'     { $extra = @('--ignore', 'tests/test_estimator_numba.py') }
            'skip-multi-polygon'   { $extra = @('--ignore', 'tests/test_multi_polygon.py') }
            'numpy-only-nocapture' { pip uninstall -y numba llvmlite }
          }
          $env:QT_LOGGING_RULES = '*.debug=false'
          python -X faulthandler -u -m pytest -v -s -p no:cacheprovider tests @extra 2>&1 | Select-Object -Last 60
          "PYTEST EXIT CODE: $LASTEXITCODE  (hex 0x{0:X8})" -f $LASTEXITCODE
          exit $LASTEXITCODE
