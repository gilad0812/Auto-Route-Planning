# Proposes dependency updates as PRs; CI (tests + build + packaged .exe self-test) decides
# whether each one is safe. Grouped and monthly to keep the noise down.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python-deps:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
